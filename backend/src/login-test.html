<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>TAIMAKO Login Test</title><style>body{font:17px Arial;max-width:440px;margin:24px auto;padding:16px}input,button{box-sizing:border-box;width:100%;padding:13px;font-size:17px;margin:7px 0 16px}button{background:#176b44;color:white;border:0}section{border:1px solid #ccc;padding:14px;margin:18px 0}#change{display:none}</style></head><body><h1>TAIMAKO Administrator Login Test</h1><p>Use only on the official TAIMAKO backend. Your credentials are not saved in the browser.</p><section><h2>1. Log in</h2><form id="login"><label>Username<input id="username" value="Shugaba" required autocomplete="username"></label><label>Temporary password<input id="password" type="password" required autocomplete="off"></label><button>Log in</button></form></section><section id="change"><h2>2. Change password</h2><form id="changeForm"><label>Temporary password<input id="old" type="password" required autocomplete="off"></label><label>New permanent password (12–128 characters)<input id="new" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Confirm new password<input id="confirm" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button>Change password</button></form></section><p id="status" role="status"></p><script>
let token=null;const status=document.getElementById("status");
document.getElementById("login").onsubmit=async e=>{e.preventDefault();const p=document.getElementById("password");let credential=p.value;p.value="";status.textContent="Checking login...";try{let r=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,credential}),cache:"no-store"});let d=await r.json();if(!r.ok){status.textContent="Login unsuccessful (HTTP "+r.status+"). Do not repeatedly retry.";return}if(d.role!=="ADMIN"){status.textContent="This page is for administrator testing only.";return}token=d.token;if(d.mustChangeCredential){document.getElementById("change").style.display="block";status.textContent="Login accepted. Enter your temporary password again below and choose a different permanent password."}else{status.textContent="Login successful; password change is already complete.";token=null}}catch{status.textContent="Connection error."}};
document.getElementById("changeForm").onsubmit=async e=>{e.preventDefault();if(!token)return;let old=document.getElementById("old"),n=document.getElementById("new"),c=document.getElementById("confirm");if(n.value!==c.value){status.textContent="New passwords do not match.";return}let currentCredential=old.value,newCredential=n.value;old.value="";n.value="";c.value="";status.textContent="Changing password...";try{let r=await fetch("/auth/change-credential",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({currentCredential,newCredential}),cache:"no-store"});token=null;status.textContent=r.ok?"Password changed successfully. Please use your new password next time.":"Change unsuccessful (HTTP "+r.status+"). Log in again before retrying.";if(r.ok)document.getElementById("change").style.display="none"}catch{token=null;status.textContent="Connection error. Log in again to check status."}};
</script></body></html>
